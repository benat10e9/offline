name: content

# Builds the medical/survival package from catalog/sources/medical-survival.json,
# signs it with the development key, verifies it, measures it, and publishes it
# to the content-dev release.
on:
  workflow_dispatch:
    inputs:
      catalog:
        description: "Catalog name in catalog/sources/ (without .json)"
        default: medical-survival
  push:
    branches: [main]
    paths: ["catalog/sources/**", "factory/build_package.py", "evals/**", ".github/workflows/content.yml"]

permissions:
  contents: write

env:
  CAT: ${{ inputs.catalog || 'medical-survival' }}

jobs:
  model-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Model downloads used by provisioning still resolve
        run: |
          for u in \
            https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf \
            https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf; do
            size=$(curl -sIL --fail "$u" | grep -i '^content-length' | tail -1 | tr -d '\r' | awk '{print $2}')
            echo "$u  $((size / 1000000)) MB" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "${size:-0}" -gt 1000000000 ] || { echo "unexpected size"; exit 1; }
          done

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          pip install libzim lxml
      - name: Factory tests
        run: python3 -m unittest factory/test_factory.py
      - name: Build kb
        run: cargo build --release -p kb-cli
      - name: Acquire and convert sources
        run: |
          python3 factory/build_package.py "catalog/sources/$CAT.json" --work work --out "src/$CAT"
          # The source archives are no longer needed; indexing needs the space.
          du -sh work "src/$CAT" | tee disk.txt
          rm -rf work
          df -h / | tee -a disk.txt
      - name: Index, sign, verify
        env:
          KB_DEV_SIGNING_KEY: ${{ secrets.KB_DEV_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$KB_DEV_SIGNING_KEY" > dev.key
          mkdir -p pkgs
          set -o pipefail
          target/release/kb build --src "src/$CAT" --out "pkgs/$CAT" --key dev.key 2>&1 | tee build.log
          rm -f dev.key
          target/release/kb verify --full --pkg pkgs/$CAT --trust trust/dev-publisher.pub
      - name: Measure
        run: |
          {
            echo "### Package size"
            echo '```'
            du -sh pkgs/$CAT pkgs/$CAT/index pkgs/$CAT/passages.jsonl
            echo '```'
            echo "### Sources"
            echo '```'
            python3 -c "import json;r=json.load(open('src/'+__import__('os').environ['CAT']+'/report.json'));[print(f'{k:<20} {v[\"documents\"]:>6} docs {v[\"passages\"]:>7} passages {v[\"chars\"]/1e6:>7.1f} M chars') for k,v in r['sources'].items()];print('FAILED:', r['failed'])"
            echo '```'
          } | tee sizes-content.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke test search
        run: |
          mkdir -p drive/packages drive/trust
          ln -s "$PWD/pkgs/$CAT" "drive/packages/$CAT"   # no second copy of a multi-GB package
          cp trust/dev-publisher.pub drive/trust/
          for q in "How do I stop severe bleeding?" "How long should I boil water to make it safe?" "What are signs of heat stroke?"; do
            target/release/kb search --pkg pkgs/$CAT --trust trust/dev-publisher.pub "$q" \
              | python3 -c "import sys,json;a=json.load(sys.stdin);print(a['class'], '|', '; '.join(h['title'] for h in a['citable'][:3]))" \
              | sed "s|^|$q -> |" | tee -a smoke.txt | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Retrieval evaluation (release gate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if [ "$CAT" != "medical-survival" ]; then
            # Evaluate this package mounted together with the medical library, as customers run it.
            gh release download content-dev --pattern "medical-survival.parts.txt" --output med.parts --clobber
            : > med.tgz
            while read -r p; do [ -n "$p" ] && gh release download content-dev --pattern "$p" --output part --clobber && cat part >> med.tgz; done < med.parts
            tar xzf med.tgz -C drive/packages && rm -f med.tgz part
          fi
          ls drive/packages
          target/release/kb eval --strict --root drive --questions evals/medical-survival.jsonl --out eval-report.json | tee eval.txt
          tail -1 eval.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publish failure details
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf work pkgs || true
          { echo "run ${{ github.run_id }} failed"; cat disk.txt 2>/dev/null; df -h /; free -m; ls -la "src/$CAT" 2>/dev/null; tail -c 20000 build.log 2>/dev/null; \
            cat "src/$CAT/report.json" 2>/dev/null; tail -50 eval.txt 2>/dev/null; } > "$CAT-failure.txt"
          gh release view content-dev >/dev/null 2>&1 || gh release create content-dev --prerelease --title "Content (development builds)" --notes "dev"
          gh release upload content-dev "$CAT-failure.txt" --clobber
      - name: Publish to content-dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf "$CAT.tar.gz" -C pkgs .
          ls -l "$CAT.tar.gz" | tee -a "$GITHUB_STEP_SUMMARY"
          gh release view content-dev >/dev/null 2>&1 || \
            gh release create content-dev --prerelease --title "Content (development builds)" \
              --notes "Signed with the development key. Not for distribution."
          ls -l "$CAT.tar.gz" >> sizes-content.txt
          for f in sizes-content.txt smoke.txt eval.txt eval-report.json; do [ -f "$f" ] && mv "$f" "$CAT-$f"; done
          cp "src/$CAT/report.json" "$CAT-report.json"
          # Release assets max out at 2 GB: split larger packages; provisioning reassembles them.
          size=$(stat -c %s "$CAT.tar.gz")
          if [ "$size" -gt 1900000000 ]; then
            split -b 1900m -d "$CAT.tar.gz" "$CAT.tar.gz.part-"
            ls "$CAT".tar.gz.part-* | xargs -n1 basename > "$CAT.parts.txt"
            gh release upload content-dev "$CAT".tar.gz.part-* "$CAT.parts.txt" --clobber
          else
            echo "$CAT.tar.gz" > "$CAT.parts.txt"
            gh release upload content-dev "$CAT.tar.gz" "$CAT.parts.txt" --clobber
          fi
          gh release upload content-dev trust/dev-publisher.pub "$CAT"-*.txt "$CAT"-*.json --clobber
