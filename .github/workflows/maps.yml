name: maps

# Builds the Texas map package: vector tiles cut from a Protomaps OpenStreetMap build,
# an offline place-search gazetteer from a Geofabrik extract, bundled fonts and icons.
# Signs with the development key and publishes to the maps-dev release.
on:
  workflow_dispatch:
    inputs:
      maxzoom:
        description: "Maximum tile zoom (14 = street level)"
        default: "14"
  push:
    branches: [main]
    paths: ["factory/build_maps.py", "runtime/routing/**", ".github/workflows/maps.yml"]

permissions:
  contents: write

env:
  REGION: texas
  TITLE: Texas
  BBOX: "-106.65,25.84,-93.51,36.50"
  GEOFABRIK: https://download.geofabrik.de/north-america/us/texas-latest.osm.pbf
  PMTILES_VERSION: "1.31.2"
  PMTILES_SHA256: 3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f
  ASSETS_COMMIT: 028c18f713baecad011301ff7a69acc39bcc2ae7

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y osmium-tool
          curl -fsSL -o pmtiles.tgz "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          echo "${PMTILES_SHA256}  pmtiles.tgz" | sha256sum -c -
          tar xzf pmtiles.tgz pmtiles && ./pmtiles version
      - name: Build kb
        run: cargo build --release -p kb-cli
      - name: Cut tiles from the latest Protomaps build
        run: |
          BUILD=$(curl -fsSL https://build-metadata.protomaps.dev/builds.json | python3 -c "import sys,json;b=sorted(json.load(sys.stdin),key=lambda x:x['key']);print(b[-1]['key'])")
          echo "Protomaps build: $BUILD" | tee -a "$GITHUB_STEP_SUMMARY"
          ./pmtiles extract "https://build.protomaps.com/$BUILD" "$REGION.pmtiles" \
            --bbox="$BBOX" --maxzoom="${{ inputs.maxzoom || '14' }}" --download-threads=4
          ls -l "$REGION.pmtiles"
      - name: Extract places
        run: |
          curl -fsSL -o region.osm.pbf "$GEOFABRIK"
          curl -fsSL "$GEOFABRIK.md5" | sed 's/texas-latest.osm.pbf/region.osm.pbf/' | md5sum -c -
          osmium tags-filter region.osm.pbf \
            n/place=city,town,village,hamlet \
            nwr/amenity=hospital,clinic,pharmacy,fire_station,police,shelter,drinking_water,fuel \
            nwr/social_facility=shelter nwr/shop=supermarket \
            -o places.osm.pbf --overwrite
          osmium export places.osm.pbf -f geojsonseq -o places.geojsonseq --overwrite
      - name: Fonts and icons
        run: |
          curl -fsSL -o assets.tgz "https://codeload.github.com/protomaps/basemaps-assets/tar.gz/${ASSETS_COMMIT}"
          mkdir assets && tar xzf assets.tgz -C assets --strip-components=1
      - name: Assemble, sign, verify
        env:
          KB_DEV_SIGNING_KEY: ${{ secrets.KB_DEV_SIGNING_KEY }}
        run: |
          python3 factory/build_maps.py --region "$REGION" --title "$TITLE" --bbox="$BBOX" \
            --pmtiles "$REGION.pmtiles" --places places.geojsonseq --assets assets \
            --out "src/maps-$REGION" --maxzoom "${{ inputs.maxzoom || '14' }}"
          /usr/bin/time -v target/release/kb route-build --pbf region.osm.pbf --out "src/maps-$REGION/maps/routing" 2> route-build.time
          grep -E "Maximum resident|Elapsed" route-build.time | tee -a "$GITHUB_STEP_SUMMARY"
          umask 077 && printf '%s\n' "$KB_DEV_SIGNING_KEY" > dev.key
          target/release/kb build --src "src/maps-$REGION" --out "pkgs/maps-$REGION" --key dev.key
          rm -f dev.key
          target/release/kb verify --full --pkg "pkgs/maps-$REGION" --trust trust/dev-publisher.pub
      - name: Measure and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf "maps-$REGION.tar.gz" -C pkgs .
          {
            echo "maps-$REGION package"
            du -sh "pkgs/maps-$REGION" "pkgs/maps-$REGION/maps/$REGION.pmtiles" "pkgs/maps-$REGION/maps/gazetteer.jsonl" "pkgs/maps-$REGION/maps/assets" "pkgs/maps-$REGION/maps/routing"
            cat "pkgs/maps-$REGION/maps/routing/meta.json"
            grep -E "Maximum resident|Elapsed" route-build.time
            echo "Austin -> Houston (expect ~165 mi, ~2h45m):"
            /usr/bin/time -f "route peak RSS %M KB" target/release/kb route --dir "pkgs/maps-$REGION/maps/routing" --from 30.2672,-97.7431 --to 29.7604,-95.3698 2>&1
            echo "Dallas -> El Paso (expect ~635 mi, ~9h):"
            target/release/kb route --dir "pkgs/maps-$REGION/maps/routing" --from 32.7767,-96.7970 --to 31.7619,-106.4850
            ls -l "maps-$REGION.tar.gz"
            python3 -c "import json;m=json.load(open('pkgs/maps-$REGION/maps/map.json'));print('places:',m['places'],'maxzoom:',m['maxzoom'])"
          } | tee sizes-maps.txt | tee -a "$GITHUB_STEP_SUMMARY"
          size=$(stat -c %s "maps-$REGION.tar.gz")
          [ "$size" -lt 2000000000 ] || { echo "Over the 2 GB release-asset limit; re-run with a lower maxzoom"; exit 1; }
          gh release view maps-dev >/dev/null 2>&1 || \
            gh release create maps-dev --prerelease --title "Maps (development builds)" \
              --notes "Signed with the development key. Map data (c) OpenStreetMap contributors, ODbL. Not for distribution."
          gh release upload maps-dev "maps-$REGION.tar.gz" sizes-maps.txt --clobber
      - name: Publish failure details
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "run ${{ github.run_id }} failed"; df -h /; free -m; cat route-build.time 2>/dev/null | tail -60; } > maps-failure.txt
          gh release view maps-dev >/dev/null 2>&1 || gh release create maps-dev --prerelease --title "Maps (development builds)" --notes "dev"
          gh release upload maps-dev maps-failure.txt --clobber
